<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
  <h1 class="text-center mb-4">Мій щоденний трекер настрою</h1>
  <p>Запишіть свій настрій або найважливішу думку за сьогодні.</p>

  <textarea class="form-control mb-3" placeholder="Як ви себе почуваєте сьогодні?"></textarea>

  <div class="text-center mb-3">
    <button class="btn btn-primary">Зберегти настрій</button>
  </div>

  <div class="p-3 mb-3 bg-success text-white rounded">🌞 Бадьорий</div>
  <div class="p-3 mb-3 bg-warning text-dark rounded">😐 Спокійний</div>
  <div class="p-3 mb-3 bg-danger text-white rounded">😫 Втомлений</div>
  <div class="p-3 mb-3 bg-info text-dark rounded">🤔 Зосереджений</div>
  <div class="p-3 mb-4 bg-primary text-white rounded">😄 Радісний</div>
</body>
</html>
